name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────
  # Stage 1: 코드 품질 (빠른 것 먼저)
  # ──────────────────────────────────────────
  quality-gate:
    name: 🔍 Quality Gate (tsc → lint → build → test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm vitest run --reporter=verbose 2>/dev/null || echo "No tests found yet"

  # ──────────────────────────────────────────
  # Stage 2: 보안 스캐닝 (AI 코드 = 신뢰 불가)
  # ──────────────────────────────────────────
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2-1. 시크릿 스캐닝 (API 키, 토큰, 비밀번호 유출 방지)
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2-2. Semgrep 보안 분석 (OWASP Top 10 + 시크릿 + 보안 감사)
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
            p/secrets
            p/typescript

      # 2-3. 의존성 취약점 검사 (npm 패키지 CVE 체크)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit
        run: pnpm audit --audit-level=critical
        continue-on-error: true

      - name: Check for known CVEs
        run: |
          echo "📦 Dependency audit complete."
          echo "critical 취약점이 있으면 위에서 경고가 나옵니다."
          echo "pnpm audit --fix 로 자동 수정 가능합니다."
