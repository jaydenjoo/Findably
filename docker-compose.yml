version: '3.8'

services:
  # n8n automation platform (local development)
  n8n:
    image: n8nio/n8n:latest
    container_name: findably-n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      # Basic configuration
      N8N_PROTOCOL: http
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      NODE_ENV: development
      WEBHOOK_TUNNEL_URL: http://host.docker.internal:5678
      # Security: Basic Auth (change in production!)
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin@example.com}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-your_secure_password_here}
      # Database: PostgreSQL (must run postgres service below)
      DB_TYPE: postgres
      DB_POSTGRE_HOST: postgres
      DB_POSTGRE_PORT: 5432
      DB_POSTGRE_USER: ${DB_POSTGRE_USER:-n8n}
      DB_POSTGRE_PASSWORD: ${DB_POSTGRE_PASSWORD:-n8n_password}
      DB_POSTGRE_DATABASE: ${DB_POSTGRE_DATABASE:-n8n}
      # Logging
      LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
      # Admin user initialization
      N8N_INITIAL_ADMIN_EMAIL: ${N8N_INITIAL_ADMIN_EMAIL:-admin@example.com}
      N8N_INITIAL_ADMIN_PASSWORD: ${N8N_INITIAL_ADMIN_PASSWORD:-your_secure_password_here}
    volumes:
      # Persist n8n data (workflow definitions, executions, etc.)
      - n8n_data:/home/node/.n8n
      # Mount workflows directory for easy editing
      - ./n8n/workflows:/workflows
    depends_on:
      - postgres
    networks:
      - findably-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5678/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL database for n8n
  postgres:
    image: postgres:16-alpine
    container_name: findably-postgres-n8n
    restart: unless-stopped
    ports:
      - '5433:5432'  # Host port 5433 to avoid conflicts with Supabase local
    environment:
      POSTGRES_USER: ${DB_POSTGRE_USER:-n8n}
      POSTGRES_PASSWORD: ${DB_POSTGRE_PASSWORD:-n8n_password}
      POSTGRES_DB: ${DB_POSTGRE_DATABASE:-n8n}
    volumes:
      # Persist PostgreSQL data
      - postgres_data:/var/lib/postgresql/data
    networks:
      - findably-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_POSTGRE_USER:-n8n}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local

networks:
  findably-network:
    driver: bridge
